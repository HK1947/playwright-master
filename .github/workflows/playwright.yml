# .github/workflows/playwright.yml

# NAME — shown in GitHub Actions tab
name: Playwright Tests

# WHEN to run this workflow
# Lesson: "trigger" = what event starts the pipeline
on:
    # Run when code is pushed to main branch
    push:
        branches: [main, master]

    # Run when Pull Request is created against main
    pull_request:
        branches: [main, master]

    # Allow manual trigger from GitHub UI
    workflow_dispatch:

# WHAT to run
jobs:
    test:
        # WHICH machine to run on
        # ubuntu-latest = free Linux machine provided by GitHub
        runs-on: ubuntu-latest

        # Timeout — kill job if it takes too long
        timeout-minutes: 30

        # STEPS — commands that run in order
        steps:
            # Step 1: Download your code from GitHub
            # Like: git clone your-repo
            - name: Checkout code
              uses: actions/checkout@v4

            # Step 2: Install Node.js
            # Like: installing JDK on CI machine
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            # Step 3: Install dependencies from package.json
            # npm ci = clean install (faster + stricter than npm install)
            - name: Install dependencies
              run: npm ci

            # Step 4: Install Playwright browsers
            # Downloads Chromium, Firefox, WebKit
            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            # Step 5: Create .env.qa file with secrets
            # Secrets stored in GitHub Settings → Secrets
            # NOT in code — never commit passwords
            - name: Create environment file
              run: |
                  echo "QA_PLAYGROUND_URL=${{ secrets.QA_PLAYGROUND_URL }}" >> .env.qa
                  echo "BANK_USERNAME=${{ secrets.BANK_USERNAME }}" >> .env.qa
                  echo "BANK_PASSWORD=${{ secrets.BANK_PASSWORD }}" >> .env.qa
                  echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env.qa

            # Step 6: Run lint check
            - name: Run ESLint
              run: npm run lint

            # Step 7: Run Playwright tests
            - name: Run Playwright tests
              run: npx playwright test
              env:
                  CI: true
                  # CI=true triggers:
                  # - retries: 1 (from our config)
                  # - workers: 1 (from our config)
                  # - forbidOnly: true (from our config)

            # Step 8: Upload test report as artifact
            # Even if tests fail — always upload report for debugging
            - name: Upload HTML Report
              uses: actions/upload-artifact@v4
              if: always()
              # if: always() = upload even when tests FAIL
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
                  # Keep report for 14 days then auto-delete

            # Step 9: Upload test results (screenshots, videos, traces)
            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14
